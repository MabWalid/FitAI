version: '3.8'

services:
  # Base de données PostgreSQL 16
  postgres:
    image: postgres:16-alpine
    container_name: fitai-postgres
    restart: always
    environment:
      POSTGRES_DB: fitai_db
      POSTGRES_USER: fitai_user
      POSTGRES_PASSWORD: fitai_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - fitai-network

  # Interface d'administration PgAdmin 4
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: fitai-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@fitai.dev
      PGADMIN_DEFAULT_PASSWORD: adminpassword
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - fitai-network

  # Service Backend Spring Boot
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fitai-backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=fitai_db
      - DB_USER=fitai_user
      - DB_PASSWORD=fitai_password
    depends_on:
      - postgres
    networks:
      - fitai-network

networks:
  fitai-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
